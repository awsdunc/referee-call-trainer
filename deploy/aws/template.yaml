AWSTemplateFormatVersion: "2010-09-09"
Description: Referee Call Trainer - private S3 bucket and leaderboard API (Lambda + DynamoDB) served over HTTPS by CloudFront.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  LeaderboardRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: scores-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt ScoresTable.Arn

  # Scores sort by sk = (100 - pct, zero padded) # time # id, so a plain Query returns the best first
  # and ties go to whoever got there earlier.
  LeaderboardFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LeaderboardRole.Arn
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref ScoresTable
      Code:
        ZipFile: |
          const { DynamoDBClient, PutItemCommand, QueryCommand } = require("@aws-sdk/client-dynamodb");
          const db = new DynamoDBClient({});
          const TABLE = process.env.TABLE_NAME, BOARD = "match", TOP = 10;
          const NAME = /^[\p{L}\p{N} ._'-]{1,20}$/u;
          const json = (statusCode, body) => ({
            statusCode,
            headers: { "content-type": "application/json", "cache-control": "no-store" },
            body: JSON.stringify(body),
          });

          exports.handler = async (event) => {
            const method = event.requestContext?.http?.method;
            if (method === "GET") {
              const r = await db.send(new QueryCommand({
                TableName: TABLE,
                KeyConditionExpression: "pk = :b",
                ExpressionAttributeValues: { ":b": { S: BOARD } },
                Limit: TOP,
              }));
              return json(200, { scores: r.Items.map((i) => ({ name: i.name.S, pct: Number(i.pct.N), at: i.at.S })) });
            }
            if (method === "POST") {
              let body;
              try {
                body = JSON.parse(event.isBase64Encoded ? Buffer.from(event.body || "", "base64").toString() : event.body || "");
              } catch {
                return json(400, { error: "Request body must be JSON." });
              }
              const name = typeof body?.name === "string" ? body.name.trim().replace(/\s+/g, " ") : "";
              const pct = body?.pct;
              if (!NAME.test(name)) return json(400, { error: "Use 1 to 20 letters, numbers or spaces." });
              if (!Number.isInteger(pct) || pct < 0 || pct > 100) return json(400, { error: "Score must be a whole number from 0 to 100." });
              const at = new Date().toISOString();
              const sk = `${String(100 - pct).padStart(3, "0")}#${at}#${Math.random().toString(36).slice(2, 10)}`;
              await db.send(new PutItemCommand({
                TableName: TABLE,
                Item: { pk: { S: BOARD }, sk: { S: sk }, name: { S: name }, pct: { N: String(pct) }, at: { S: at } },
              }));
              let ahead = 0, start;
              do {
                const r = await db.send(new QueryCommand({
                  TableName: TABLE,
                  KeyConditionExpression: "pk = :b AND sk < :k",
                  ExpressionAttributeValues: { ":b": { S: BOARD }, ":k": { S: sk } },
                  Select: "COUNT",
                  ExclusiveStartKey: start,
                }));
                ahead += r.Count;
                start = r.LastEvaluatedKey;
              } while (start);
              return json(201, { rank: ahead + 1 });
            }
            return json(405, { error: "Method not allowed." });
          };

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt LeaderboardFunction.Arn
      PayloadFormatVersion: "2.0"

  GetScoresRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/scores
      Target: !Sub "integrations/${HttpApiIntegration}"

  PostScoreRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /api/scores
      Target: !Sub "integrations/${HttpApiIntegration}"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  HttpApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LeaderboardFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Referee Call Trainer
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: leaderboard-api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: leaderboard-api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  ScoresTableName:
    Value: !Ref ScoresTable
